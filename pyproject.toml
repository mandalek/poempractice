[project]
name = "poempractice"
version = "0.1.0"
description = "Couplet evaluation engine scaffold for rhyme and syllable games"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
